
<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#111a2b;display:flex;justify-content:space-between}
.logo{font-size:28px;font-weight:bold;color:#31b8ff}

main{padding:18px;max-width:900px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:#141f32;border-radius:12px;overflow:hidden}
.card iframe{width:100%;aspect-ratio:16/9;border:0}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:#263b60;font-size:40px}
.card h3{padding:0 12px;font-size:15px}
button{background:#168cff;color:white;border:0;padding:12px 18px;border-radius:8px;font-size:16px}
footer{text-align:center;padding:25px;color:#aab8cc}
</style>
</head>
<body>

<script>
/* YouTube video ID yahan add karein */
const videos=[
{title:"My First Video",id:""},
{title:"My New Video",id:""}
];
const gallery=document.getElementById("gallery");
videos.forEach(v=>{
const card=document.createElement("div");
card.className="card";
if(v.id){
const f=document.createElement("iframe");
f.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(v.id);
f.title=v.title;
f.allowFullscreen=true;
card.appendChild(f);
}else{
const t=document.createElement("div");
t.className="thumb";
t.textContent="▶";
card.appendChild(t);
}
const h=document.createElement("h3");
h.textContent=v.title;
card.appendChild(h);
gallery.appendChild(card);
});
</script>
